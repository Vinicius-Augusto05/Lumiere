
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Lumière — Uma carta de amor aos videogames</title>

    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Playfair+Display:wght@400;500;600&display=swap" rel="stylesheet">
</head>

<body>

    <header class="cabecalho">

        <a href="#inicio" class="logo">
            LUMIÈRE<span>.</span>
        </a>

        <nav>
            <a href="#manifesto">Manifesto</a>
            <a href="#mundos">Mundos</a>
            <a href="#manifesto">Obras</a>
        </nav>

    </header>

    <main>


        <section class="hero" id="inicio">

            <img
                src="img/tunic-fundo.png"
                alt="Um mundo de videogame"
                class="hero-imagem"
            >

            <div class="hero-sombra"></div>

            <div class="hero-conteudo">

                <span class="sobretitulo">
                    UMA CARTA DE AMOR AOS VIDEOGAMES
                </span>

                <h1>Lumière<span>.</span></h1>

                <a href="#manifesto" class="botao">
                    Entre nesse universo <span>↓</span>
                </a>

            </div>

            <span class="indicacao">
                CONTINUE DESCENDO
            </span>

        </section>


        <section class="manifesto" id="manifesto">

            <img
                src="img/sirene-fundo.png"
                alt="Universo de Clair Obscur: Expedition 33"
                class="manifesto-imagem"
            >

            <div class="manifesto-sombra"></div>

            <div class="manifesto-conteudo">

                <span class="sobretitulo">
                    01 — MAIS DO QUE JOGOS
                </span>

                <h2>
                    Uma forma de <span>arte.</span>
                </h2>

            </div>

        </section>


        <section class="mundos" id="mundos">

            <img
                src="img/expedition-fundo.png"
                alt="Paisagem de Clair Obscur: Expedition 33"
                class="mundos-imagem"
            >

            <div class="mundos-sombra"></div>

            <div class="mundos-conteudo">

                <span class="sobretitulo">
                    02 — A BELEZA DE CRIAR MUNDOS
                </span>

                <h2>
                    Lugares que parecem <span>vivos.</span>
                </h2>

            </div>

        </section>

    </main>

</body>
</html>

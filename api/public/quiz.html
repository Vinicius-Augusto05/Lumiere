
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Lumière — Descubra seu estilo</title>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="quiz.css">
</head>

<body>

    <main>

        <section class="quiz-apresentacao">

            <span class="quiz-legenda">
                UMA EXPERIÊNCIA SOBRE VOCÊ
            </span>

            <h1>Descubra seu estilo de jogador.</h1>

            <p>
                Cinco perguntas para descobrir um pouco mais sobre
                sua personalidade e encontrar experiências que
                combinam com você.
            </p>

            <div class="quiz-progresso">
                <span id="progresso">PERGUNTA 1 DE 5</span>
                <div class="quiz-barra">
                    <div id="quizBarraPreenchida"></div>
                </div>
            </div>

        </section>

        <section class="quiz-conteudo" id="quizConteudo">

            <h2 id="pergunta"></h2>

            <div id="alternativas"></div>

            <button id="botaoProximo" disabled>
                Próxima pergunta
            </button>

        </section>

    </main>

    <script src="quiz.js"></script>

</body>

</html>

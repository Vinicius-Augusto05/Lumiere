
<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lumière | Entrar</title>
    <link rel="stylesheet" href="acesso.css">
</head>

<body>

    <main class="acesso">

        <a href="index.html" class="voltar">← Lumière</a>

        <section class="acesso-conteudo">

            <span class="acesso-legenda">BEM-VINDO DE VOLTA</span>

            <h1>Que bom ter você aqui.</h1>

            <p class="acesso-descricao">
                Entre e continue explorando histórias que merecem ser lembradas.
            </p>

            <form id="form_login">

                <label for="email">E-mail</label>
                <input type="email" id="email" name="email"
                    placeholder="seu@email.com" required>

                <label for="senha">Senha</label>
                <input type="password" id="senha" name="senha"
                    placeholder="Sua senha" required>

                <button type="submit">Entrar</button>

                <p id="mensagem"></p>

            </form>

            <p class="acesso-alternativa">
                Ainda não tem uma conta?
                <a href="cadastro.html">Criar conta</a>
            </p>

        </section>

        <span class="acesso-assinatura">LUMIÈRE — VIDEOGAMES, MEMÓRIAS E ARTE</span>

    </main>

    <script src="acesso.js"></script>

</body>
</html>
